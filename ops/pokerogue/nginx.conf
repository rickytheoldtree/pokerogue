worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm image/svg+xml text/css text/plain;

    server {
        listen 8080;
        root /srv/pokerogue/current;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }

        location = /release.json {
            add_header Cache-Control "no-store" always;
            try_files /release.json =404;
        }

        location = /service-worker.js {
            add_header Cache-Control "no-store" always;
            try_files /service-worker.js =404;
        }

        location ~* \.(?:css|js|wasm)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri @previous_asset;
        }

        location @previous_asset {
            root /srv/pokerogue/previous;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
